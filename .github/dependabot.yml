version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      rust-workspace:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /tools/build/third-party/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      rust-third-party:
        applies-to: version-updates
        patterns: ["*"]
  # TODO: Re-enable npm updates after Dependabot supports pnpm 11.
