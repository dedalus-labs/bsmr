[package]
name = "bsmr-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
bsmr_sandbox = { path = "../../app/bsmr_sandbox" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
libc = "0.2.186"
nix = { version = "0.30.1", features = ["fs", "poll", "process", "signal", "socket", "uio", "user"] }
thiserror = "2.0.18"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "net", "process", "time", "macros", "io-util"] }

[profile.dev]
debug = 0
