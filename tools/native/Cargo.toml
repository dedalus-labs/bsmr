[package]
name = "bsmr-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
libc = "0.2.186"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "user"] }
