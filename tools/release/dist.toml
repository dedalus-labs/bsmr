# Installs the build engine and its configured Cargo planner together.

[package]
name = "bsmr"
version = "0.0.8"
repository = "https://github.com/dedalus-labs/bsmr"
description = "An incremental build system"
license = "Apache-2.0"
binaries = ["bsmr", "bsmr-cargo"]
build-command = ["node", "../../ci/distribute.mjs"]

[dist]
dist = true
include = ["../../LICENSE", "../../LICENSE-APACHE", "../../LICENSE-MIT", "../../NOTICE"]
