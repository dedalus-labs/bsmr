site_name: Bessemer
site_description: Fast, cached builds from native project files.
site_url: https://oss.dedaluslabs.ai/bsmr
repo_url: https://github.com/dedalus-labs/bsmr
repo_name: dedalus-labs/bsmr
site_author: Dedalus Labs
edit_uri: edit/main/docs/

# Publish only pages that have been rewritten for BSMR. The remaining Markdown
# files are retained as upstream engineering reference until they are curated.
exclude_docs: |
  /*
  !/index.md
  !/getting_started/
  /getting_started/*
  !/getting_started/index.md
  !/getting_started/install.md
  !/getting_started/quickstart.md
  !/about/
  /about/*
  !/about/language_support.md
  !/concepts/
  /concepts/*
  !/concepts/caching.md
  !/concepts/test-observability.md
  !/users/
  /users/*
  !/users/sandboxing.md
  !/users/languages/
  /users/languages/*
  !/users/languages/typescript/
  /users/languages/typescript/*
  !/users/languages/typescript/pnpm.md
  !/users/languages/rust/
  /users/languages/rust/*
  !/users/languages/rust/cargo.md
  !/users/languages/go/
  /users/languages/go/*
  !/users/languages/go/native.md
  !/reference/
  /reference/*
  !/reference/index.md
  !/reference/cli.md
  !/reference/configuration.md
  !/roadmap.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/theme-light-dark
        name: "Theme: automatic"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: "Theme: light"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: "Theme: dark"
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Bessemer is a build system that reads native ecosystem manifests,
        schedules hermetic actions, and restores outputs from a content-addressed cache.
        TypeScript with pnpm is the primary ecosystem. Rust and Go are experimental.
      sections:
        Getting Started:
          - getting_started/quickstart.md
          - getting_started/install.md
        Languages:
          - users/languages/typescript/pnpm.md
          - users/languages/rust/cargo.md
          - users/languages/go/native.md
        Concepts:
          - concepts/caching.md
          - concepts/test-observability.md
          - roadmap.md
        Execution:
          - users/sandboxing.md
        Reference:
          - reference/cli.md
          - reference/configuration.md
  - llmstxt-md:
      enable_markdown_urls: true
      enable_llms_txt: false
      enable_llms_full: false
      enable_copy_button: true
      copy_button_text: "Copy page"
      sections:
        All:
          - "*.md"
          - "**/*.md"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      anchorlink: true
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting_started/index.md
      - Quick Start: getting_started/quickstart.md
      - Installation: getting_started/install.md
  - Languages:
      - TypeScript and pnpm: users/languages/typescript/pnpm.md
      - Rust and Cargo: users/languages/rust/cargo.md
      - Go: users/languages/go/native.md
      - Support status: about/language_support.md
  - Concepts:
      - Caching and Hermeticity: concepts/caching.md
      - Test Observability: concepts/test-observability.md
  - Execution:
      - Sandboxed builds: users/sandboxing.md
  - Reference:
      - Overview: reference/index.md
      - Command line: reference/cli.md
      - Projects and configuration: reference/configuration.md
  - Roadmap: roadmap.md

extra_css:
  - assets/theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dedalus-labs/bsmr

copyright: Copyright 2026 Dedalus Labs, Inc. and its contributors

validation:
  omitted_files: ignore
  absolute_links: warn
  unrecognized_links: warn
